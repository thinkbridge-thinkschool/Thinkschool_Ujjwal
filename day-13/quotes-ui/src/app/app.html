@if (auth.isLoggedIn()) {
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <span class="brand-mark small">❝</span>
        <span class="brand-word">Quotes API</span>
      </div>
      <div class="navbar-links">
        <a
          routerLink="/quotes"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >Quotes</a>
        <a routerLink="/quotes/new" routerLinkActive="active" class="nav-link">Create quote</a>
        <a routerLink="/quotes/new-signal" routerLinkActive="active" class="nav-link">Create quote (Signal Forms)</a>
      </div>
      <button type="button" class="nav-link logout" (click)="logout()">Log out</button>
    </div>
  </nav>

  <main class="page">
    <router-outlet />
  </main>
} @else {
  <router-outlet />
}
