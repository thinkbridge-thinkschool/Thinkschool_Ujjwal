<div class="quotes">
  <input
    class="filter-input"
    type="text"
    placeholder="Filter by author or text..."
    (input)="onFilterInput($event)"
  />

  @switch (loadState()) {
    @case ('loading') {
      <p class="status"><span class="spinner" aria-hidden="true"></span> Loading quotes...</p>
    }
    @case ('error') {
      <p class="status error">Could not load quotes. Is the API running?</p>
    }
    @case ('loaded') {
      @if (filteredQuotes().length === 0) {
        <p class="status">No quotes found.</p>
      } @else {
        <div class="quote-grid">
          @for (quote of filteredQuotes(); track quote.id) {
            <button
              type="button"
              class="quote-card"
              [class.selected]="quote.id === selectedId()"
              [attr.aria-pressed]="quote.id === selectedId()"
              (click)="onSelect(quote.id)"
            >
              <span class="quote-mark">❝</span>
              <blockquote>{{ quote.text }}</blockquote>
              <p class="author">— {{ quote.author }}</p>
            </button>
          }
        </div>
      }
    }
  }

  <app-quote-detail [quoteId]="selectedId()" />
</div>
