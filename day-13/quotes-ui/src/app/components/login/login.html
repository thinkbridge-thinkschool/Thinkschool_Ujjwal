<div class="auth-page">
  <div class="auth-hero">
    <span class="watermark-quote hero-watermark" aria-hidden="true">❝</span>
    <div class="brand">
      <span class="brand-mark">❝</span>
      <span class="brand-word">Quotes API</span>
    </div>
    <h1>Every good idea<br>started as a line<br>worth remembering.</h1>
    <p class="hero-tagline">
      A small collection of quotes, built on a real ASP.NET Core API —
      sign in to browse, filter, and add your own.
    </p>
  </div>
  <div class="auth-panel">
    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <h2>{{ mode() === 'sign-in' ? 'Log in' : 'Create account' }}</h2>

      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          [attr.autocomplete]="mode() === 'sign-in' ? 'current-password' : 'new-password'"
        />
      </div>

      @if (error()) {
        <p class="form-error" role="alert">{{ error() }}</p>
      }

      <button type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span> Please wait…
        } @else {
          {{ mode() === 'sign-in' ? 'Log in' : 'Create account' }}
        }
      </button>

      <button type="button" class="toggle-link" (click)="toggleMode()">
        {{ mode() === 'sign-in' ? "Don't have an account? Create one" : 'Already have an account? Log in' }}
      </button>
    </form>
  </div>
</div>
