name: Deploy quotes-ui to Azure Static Web Apps

on:
  push:
    branches: [day17-deploy]
    paths:
      - "day-13/quotes-ui/**"
      - ".github/workflows/azure-static-web-apps.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [day17-deploy]
    paths:
      - "day-13/quotes-ui/**"
      - ".github/workflows/azure-static-web-apps.yml"

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: day-13/quotes-ui/package-lock.json

      - name: Install dependencies
        working-directory: day-13/quotes-ui
        run: npm ci

      - name: Build (production)
        working-directory: day-13/quotes-ui
        run: npx ng build --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "day-13/quotes-ui/dist/quotes-ui/browser"
          api_location: ""
          skip_app_build: true
          output_location: ""

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
